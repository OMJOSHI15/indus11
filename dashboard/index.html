<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%230b0b0b%27/%3E%3Ctext x=%2716%27 y=%2721%27 font-family=%27-apple-system,Arial%27 font-size=%2713%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%23fff%27%3EI11%3C/text%3E%3C/svg%3E" />
    <meta name="theme-color" content="#f5f5f3" />
    <meta name="description" content="Indus11: real-time transaction fraud scoring with rule, graph and retrieval layers. Every decision carries the signals that caused it." />
    <!-- Apple devices render in SF Pro via -apple-system; Inter and JetBrains
         Mono are the closest stand-ins everywhere else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so a dark-mode reload never flashes white.
      try {
        const saved = localStorage.getItem("indus11-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>Indus11 · Fraud Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
