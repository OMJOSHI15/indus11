<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#f5f5f3" />
    <meta name="description" content="Nirix: real-time transaction fraud scoring with rule, graph and retrieval layers. Every decision carries the signals that caused it." />
    <!-- Apple devices render in SF Pro via -apple-system; Inter and JetBrains
         Mono are the closest stand-ins everywhere else. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme before first paint so a dark-mode reload never flashes white.
      try {
        const saved = localStorage.getItem("indus11-theme");
        document.documentElement.dataset.theme =
          saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
    <title>Nirix · Fraud Intelligence</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
