name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # Wheels are restored from the cache when requirements.txt is
          # unchanged, so a run does not depend on every package still being
          # fetchable. A package index failure broke this workflow once with
          # "No matching distribution found for grpcio", which the next run
          # resolved on its own.
          cache: pip
      - name: Install dependencies
        # Retries and a longer timeout ride out a slow or flaking index
        # instead of failing the build on the first refused connection.
        run: |
          python -m pip install --upgrade pip
          pip install --retries 5 --timeout 60 -r requirements.txt
      - name: Run tests
        run: pytest -q
